name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - name: Find project folder
        id: find
        run: |
          echo "Files in repository:"
          ls -la
          GRADLEW=$(find . -maxdepth 3 -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found. The project files were not uploaded to this repository."
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x runCheckstyle --stacktrace -DskipFormatKtlint
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pipe-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
